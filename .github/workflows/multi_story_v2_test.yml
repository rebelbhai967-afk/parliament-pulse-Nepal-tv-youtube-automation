name: Parliament Pulse Nepal Multi-Story V2 Test

on:
  workflow_dispatch:

concurrency:
  group: parliament-pulse-v2-test
  cancel-in-progress: true

jobs:
  multi-story-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      WHISPER_BEAM_SIZE: "1"
      WHISPER_TEMPERATURE: "0.0"
      WHISPER_CPU_THREADS: "2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Cache Python and Whisper assets
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: ${{ runner.os }}-python-whisper-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-whisper-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile editorial pipeline
        run: |
          python -m py_compile src/download_multi.py src/editorial_hooks.py src/batch_analyze_v2.py src/generate_metadata_v2.py src/render_stories.py src/validate_metadata.py src/editorial_gate.py src/editorial_review.py src/normalize_selection.py

      - name: Discover both Parliament Houses
        run: |
          mkdir -p data
          python src/discover.py data/parliament_collections.json

      - name: Download latest collections from both Houses
        run: |
          python src/download_multi.py data/parliament_collections.json data/videos 4 12

      - name: Verify multi-source download
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          items=json.loads(Path("data/videos/videos.json").read_text(encoding="utf-8"))
          houses=sorted({x.get("house") for x in items if x.get("house")})
          print("Videos:", len(items))
          print("Houses:", houses)
          if len(items) < 8:
              raise RuntimeError(f"Need at least 8 distinct source videos for the 2 Long + 2 Short daily build; found {len(items)}.")
          if len(houses) < 2:
              raise RuntimeError("Both National Assembly and House of Representatives are required.")
          house_counts = {}
          for x in items:
              house = x.get("house")
              if house:
                  house_counts[house] = house_counts.get(house, 0) + 1
          print("Videos by House:", house_counts)
          if any(house_counts.get(h, 0) < 2 for h in ("House of Representatives", "National Assembly")):
              raise RuntimeError(f"Need at least 2 source videos from each Parliament House; found {house_counts}")
          if len({x.get("page") for x in items}) != len(items):
              raise RuntimeError("Duplicate Parliament source pages detected.")
          named=[x for x in items if x.get("speaker")]
          print("Verified named-speaker source videos:", len(named))
          named_by_house={}
          for x in named:
              named_by_house[x.get("house")]=named_by_house.get(x.get("house"),0)+1
          print("Named speakers by House:", named_by_house)
          print("Speaker names are optional. The official archive sometimes exposes member names only in page labels/attributes; extraction is best-effort.")
          if len(named) == 0:
              print("WARNING: this source batch exposes no verified member names; the editorial pipeline will keep speaker attribution empty rather than invent a name.")
          PY

      - name: Transcribe all candidate videos
        run: |
          mkdir -p data/transcripts
          python src/batch_transcribe.py data/videos data/transcripts

      - name: Clean transcripts
        run: |
          mkdir -p data/transcripts_clean
          python src/batch_clean.py data/transcripts data/transcripts_clean

      - name: Select editorial stories with transcript-grounded hooks
        run: |
          python src/batch_analyze_v2.py data/transcripts_clean data/multi_story_selection.json

      - name: Normalize selected stories to exact rendered windows
        run: |
          python src/normalize_selection.py data/multi_story_selection.json data/multi_story_selection.normalized.json
          mv data/multi_story_selection.normalized.json data/multi_story_selection.json

      - name: Translate candidate transcripts to English subtitles and topic summaries
        run: |
          mkdir -p data/subtitles_v2
          python src/batch_translate.py data/transcripts_clean data/subtitles_v2 data/subtitles_v2/topic_summaries.json

      - name: Generate human-style English metadata and hook package
        run: |
          mkdir -p data/metadata_v2
          python src/generate_metadata_v2.py data/multi_story_selection.json data/metadata_v2 data/subtitles_v2/topic_summaries.json

      - name: Validate metadata, hooks and neutrality
        run: |
          python src/validate_metadata.py data/metadata_v2

      - name: Run editorial safety and repetition gate
        run: |
          python src/editorial_gate.py data/multi_story_selection.json data/metadata_v2

      - name: Build human editorial review queue
        run: |
          python src/editorial_review.py data/multi_story_selection.json data/metadata_v2/editorial_gate_report.json data/editorial_review_queue.json

      - name: Create content publication ledger
        run: |
          python src/content_ledger.py data/multi_story_selection.json data/metadata_v2 data/content_ledger.json

      - name: Render cold-open hooks and main story pieces with English subtitles
        run: |
          mkdir -p output/multi_story_pieces
          python src/render_stories.py data/multi_story_selection.json data/subtitles_v2 output/multi_story_pieces

      - name: Assemble Long and separate Short masters
        run: |
          mkdir -p output/multi_story_masters
          python src/assemble_stories.py data/multi_story_selection.json output/multi_story_pieces/.pieces output/multi_story_masters

      - name: Generate English-first thumbnails
        run: |
          mkdir -p output/multi_story_thumbnails
          python src/generate_thumbnails_v2.py data/metadata_v2 output/multi_story_masters output/multi_story_thumbnails

      - name: Automated quality control
        run: |
          python src/quality_control.py data/multi_story_selection.json output/multi_story_masters output/multi_story_thumbnails

      - name: Verify story targets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/multi_story_selection.json").read_text(encoding="utf-8"))
          longs=d.get("long_stories",[])
          shorts=d.get("short_stories",[])
          print("Long stories:",len(longs))
          print("Short stories:",len(shorts))
          long_houses = {h for s in longs for h in (s.get("houses") or []) if h}
          print("Long Houses:", sorted(long_houses))
          if len(long_houses) < 2:
              raise RuntimeError(f"Long stories must represent both Parliament Houses; found {sorted(long_houses)}")
          for kind in ("long", "short"):
              for i, story in enumerate(d.get(f"{kind}_stories", []), 1):
                  for piece in story.get("pieces", []):
                      if not piece.get("source_page"):
                          raise RuntimeError(f"{kind.title()} {i} is missing an official Parliament source page.")
          for i,s in enumerate(longs,1):
              print("LONG",i,s.get("duration"),s.get("speakers"),s.get("houses"),s.get("hook_strategy"))
              if not 181 <= float(s.get("duration",0)) <= 600:
                  raise RuntimeError(f"Long duration rule failed: {i}")
              if not (s.get("opening_hook") or {}).get("text"):
                  raise RuntimeError(f"Long hook missing: {i}")
          for i,s in enumerate(shorts,1):
              print("SHORT",i,s.get("duration"),s.get("speaker"),s.get("hook_strategy"))
              if float(s.get("duration",0)) >= 90:
                  raise RuntimeError(f"Short duration rule failed: {i}")
              if not (s.get("opening_hook") or {}).get("text"):
                  raise RuntimeError(f"Short hook missing: {i}")
          if len(longs) != 2 or len(shorts) != 2:
              raise RuntimeError(f"V2 target mismatch: expected exactly 2 Long + 2 Short, found {len(longs)} Long + {len(shorts)} Short.")
          PY

      - name: Upload V2 selection and metadata
        uses: actions/upload-artifact@v6
        with:
          name: parliament-multi-story-v2
          path: |
            data/parliament_collections.json
            data/videos/videos.json
            data/multi_story_selection.json
            data/metadata_v2/
            data/content_ledger.json
            data/editorial_review_queue.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload V2 masters
        uses: actions/upload-artifact@v6
        with:
          name: parliament-multi-story-v2-masters
          path: output/multi_story_masters/
          if-no-files-found: error
          retention-days: 3
