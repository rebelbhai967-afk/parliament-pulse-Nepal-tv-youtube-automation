name: Official Parliament Video Source Probe
on:
  workflow_dispatch:
    inputs:
      meeting_url:
        description: "Official digital.parliament.gov.np meeting page URL"
        required: false
        default: "https://digital.parliament.gov.np/baithak-detail/c97caf0c-e128-4dee-a3fe-b1dd3609ee80"
  push:
    branches: [main]
    paths:
      - "automation_posting/probe_official_video_sources.py"
      - ".github/workflows/official_video_source_probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Inspect official page without credentials
        env:
          MEETING_URL: ${{ inputs.meeting_url || 'https://digital.parliament.gov.np/baithak-detail/c97caf0c-e128-4dee-a3fe-b1dd3609ee80' }}
        run: python automation_posting/probe_official_video_sources.py "$MEETING_URL"
      - name: Save probe report
        uses: actions/upload-artifact@v4
        with:
          name: official-video-source-probe
          path: official-video-source-probe.txt
          if-no-files-found: error
