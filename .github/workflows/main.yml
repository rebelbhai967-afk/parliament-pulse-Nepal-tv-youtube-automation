name: Parliament Pulse Nepal Automation

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Test discovery
        run: |
          python src/discover.py data/videos.json

      - name: Test individual Parliament video detection
        run: |
          python - <<'PY'
          import json

          from src.download import (
              get_session,
              get_video_pages,
              get_video_source
          )

          with open(
              "data/videos.json",
              "r",
              encoding="utf-8"
          ) as file:
              collections = json.load(file)

          if not collections:
              raise RuntimeError(
                  "No Parliament collections found."
              )

          session = get_session()

          collection = collections[0]

          print("Testing collection:")
          print(collection["url"])

          videos = get_video_pages(
              collection["url"],
              session
          )

          print(
              f"Found {len(videos)} individual videos"
          )

          if not videos:
              raise RuntimeError(
                  "No individual videos found."
              )

          for video in videos:
              print("")
              print("Video:")
              print(video["url"])

              source = get_video_source(
                  video["url"],
                  session
              )

              if source:
                  print("SOURCE FOUND:")
                  print(source)
              else:
                  print("SOURCE NOT FOUND")

          PY

      - name: Test actual video download
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from src.download import (
              get_session,
              get_video_pages,
              get_video_source,
              download_file
          )

          with open(
              "data/videos.json",
              "r",
              encoding="utf-8"
          ) as file:
              collections = json.load(file)

          if not collections:
              raise RuntimeError(
                  "No Parliament collections found."
              )

          session = get_session()

          collection = collections[0]

          print("Downloading from collection:")
          print(collection["url"])

          videos = get_video_pages(
              collection["url"],
              session
          )

          if not videos:
              raise RuntimeError(
                  "No individual videos found."
              )

          video = videos[0]

          print("")
          print("Selected video:")
          print(video["url"])

          source = get_video_source(
              video["url"],
              session
          )

          if not source:
              raise RuntimeError(
                  "Video source not found."
              )

          print("")
          print("Video source:")
          print(source)

          output = Path(
              "data/test_video.mp4"
          )

          print("")
          print("Starting download...")

          download_file(
              source,
              output,
              session
          )

          if not output.exists():
              raise RuntimeError(
                  "Downloaded file does not exist."
              )

          size = output.stat().st_size

          print("")
          print(
              f"Downloaded: {output}"
          )

          print(
              f"File size: "
              f"{size / (1024 * 1024):.2f} MB"
          )

          if size < 10000:
              raise RuntimeError(
                  "Downloaded file is unexpectedly small."
              )

          print("")
          print("ACTUAL VIDEO DOWNLOAD TEST PASSED")

          PY

      - name: Upload downloaded video as artifact
        uses: actions/upload-artifact@v4
        with:
          name: parliament-test-video
          path: data/test_video.mp4
          if-no-files-found: error
