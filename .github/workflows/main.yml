name: Parliament Pulse Nepal Automation

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Test discovery
        run: |
          python src/discover.py data/videos.json

      - name: Test individual Parliament video detection
        run: |
          python -c "
          import json
          from src.download import get_session, get_video_pages, get_video_source

          with open('data/videos.json', 'r', encoding='utf-8') as file:
              collections = json.load(file)

          if not collections:
              raise RuntimeError('No Parliament collections found.')

          session = get_session()
          collection = collections[0]

          print('Testing collection:')
          print(collection['url'])

          videos = get_video_pages(collection['url'], session)

          print(f'Found {len(videos)} individual videos')

          if not videos:
              raise RuntimeError('No individual videos found.')

          for video in videos:
              print('')
              print('Video:')
              print(video['url'])

              source = get_video_source(video['url'], session)

              if source:
                  print('SOURCE FOUND:')
                  print(source)
              else:
                  print('SOURCE NOT FOUND')
          "

      - name: Test actual video download
        run: |
          python -c "
          import json
          from pathlib import Path
          from src.download import get_session, get_video_pages, get_video_source, download_file

          with open('data/videos.json', 'r', encoding='utf-8') as file:
              collections = json.load(file)

          if not collections:
              raise RuntimeError('No Parliament collections found.')

          session = get_session()
          collection = collections[0]

          print('Downloading from collection:')
          print(collection['url'])

          videos = get_video_pages(collection['url'], session)

          if not videos:
              raise RuntimeError('No individual videos found.')

          video = videos[0]

          print('')
          print('Selected video:')
          print(video['url'])

          source = get_video_source(video['url'], session)

          if not source:
              raise RuntimeError('Video source not found.')

          print('')
          print('Video source:')
          print(source)

          output = Path('data/test_video.mp4')

          print('')
          print('Starting download...')

          download_file(source, output, session)

          if not output.exists():
              raise RuntimeError('Downloaded file does not exist.')

          size = output.stat().st_size

          print('')
          print(f'Downloaded: {output}')
          print(f'File size: {size / (1024 * 1024):.2f} MB')

          if size < 10000:
              raise RuntimeError('Downloaded file is unexpectedly small.')

          print('')
          print('ACTUAL VIDEO DOWNLOAD TEST PASSED')
          "

      - name: Upload downloaded video as artifact
        uses: actions/upload-artifact@v4
        with:
          name: parliament-test-video
          path: data/test_video.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Extract clean audio
        run: |
          ffmpeg \
            -i data/test_video.mp4 \
            -vn \
            -ac 1 \
            -ar 16000 \
            -c:a pcm_s16le \
            data/test_audio.wav

      - name: Transcribe Nepali audio
        run: |
          python src/transcribe.py \
            data/test_audio.wav \
            data/test_video_transcript.json

      - name: Clean transcript
        run: |
          python src/clean_transcript.py \
            data/test_video_transcript.json \
            data/test_video_transcript_clean.json

      - name: Analyze important moments
        run: |
          python src/analyze.py \
            data/test_video_transcript_clean.json \
            data/test_video_analysis.json \
            10

      - name: Upload clean Nepali transcript
        uses: actions/upload-artifact@v4
        with:
          name: parliament-nepali-transcript-clean
          path: data/test_video_transcript_clean.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload clip analysis
        uses: actions/upload-artifact@v4
        with:
          name: parliament-clip-analysis
          path: data/test_video_analysis.json
          if-no-files-found: error
          retention-days: 7
