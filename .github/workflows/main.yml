name: Parliament Pulse Nepal Automation

on:
  workflow_dispatch:

jobs:
  daily-parliament-automation:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==================================================
      # 2. PYTHON
      # ==================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==================================================
      # 3. FFMPEG
      # ==================================================

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # ==================================================
      # 4. PYTHON DEPENDENCIES
      # ==================================================

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # ==================================================
      # 5. DISCOVER PARLIAMENT
      # ==================================================

      - name: Discover Parliament collections
        run: |
          mkdir -p data

          python src/discover.py \
            data/videos.json

      - name: Verify discovery
        run: |
          python - <<'PY'
          import json

          with open(
              "data/videos.json",
              "r",
              encoding="utf-8"
          ) as file:
              data = json.load(file)

          print("")
          print("====================================")
          print("PARLIAMENT DISCOVERY")
          print("====================================")

          print(f"Collections found: {len(data)}")

          for index, item in enumerate(
              data,
              start=1
          ):
              print(
                  f"{index}. "
                  f"{item.get('title', '')}"
              )
              print(
                  f"   {item.get('url', '')}"
              )

          if not data:
              raise RuntimeError(
                  "No Parliament collections found."
              )
          PY

      # ==================================================
      # 6. DOWNLOAD MULTIPLE VIDEOS
      # ==================================================

      - name: Download Parliament videos
        run: |
          python - <<'PY'
          import json
          from src.download import download_collection

          with open(
              "data/videos.json",
              "r",
              encoding="utf-8"
          ) as file:
              collections = json.load(file)

          if not collections:
              raise RuntimeError(
                  "No Parliament collection found."
              )

          collection = collections[0]

          print("")
          print("====================================")
          print("DOWNLOADING PARLIAMENT VIDEOS")
          print("====================================")

          print(
              f"Collection: "
              f"{collection.get('title', '')}"
          )

          download_collection(
              collection["url"],
              "data/videos",
              max_videos=10
          )
          PY

      - name: Verify downloaded videos
        run: |
          python - <<'PY'
          from pathlib import Path

          videos = sorted(
              Path("data/videos").glob(
                  "video_*.mp4"
              )
          )

          print("")
          print("====================================")
          print("DOWNLOADED VIDEOS")
          print("====================================")

          for video in videos:
              size = video.stat().st_size

              print(
                  f"{video.name}: "
                  f"{size / (1024 * 1024):.2f} MB"
              )

          print("")
          print(
              f"Total downloaded: "
              f"{len(videos)}"
          )

          if not videos:
              raise RuntimeError(
                  "No Parliament videos downloaded."
              )
          PY

      # ==================================================
      # 7. BATCH TRANSCRIPTION
      # ==================================================

      - name: Transcribe Parliament videos
        run: |
          mkdir -p data/transcripts

          python src/batch_transcribe.py \
            data/videos \
            data/transcripts

      - name: Verify transcripts
        run: |
          python - <<'PY'
          from pathlib import Path

          files = sorted(
              Path("data/transcripts").glob(
                  "video_*.json"
              )
          )

          print("")
          print("====================================")
          print("TRANSCRIPTS")
          print("====================================")

          for file in files:
              print(file)

          print("")
          print(
              f"Transcript files: "
              f"{len(files)}"
          )

          if not files:
              raise RuntimeError(
                  "No transcripts created."
              )
          PY

      # ==================================================
      # 8. CLEAN TRANSCRIPTS
      # ==================================================

      - name: Clean transcripts
        run: |
          python src/batch_clean.py \
            data/transcripts \
            data/clean_transcripts

      - name: Verify cleaned transcripts
        run: |
          python - <<'PY'
          from pathlib import Path

          files = sorted(
              Path(
                  "data/clean_transcripts"
              ).glob(
                  "video_*.json"
              )
          )

          print("")
          print("====================================")
          print("CLEAN TRANSCRIPTS")
          print("====================================")

          for file in files:
              print(file)

          print("")
          print(
              f"Clean transcripts: "
              f"{len(files)}"
          )

          if not files:
              raise RuntimeError(
                  "No cleaned transcripts found."
              )
          PY

      # ==================================================
      # 9. DAILY STORY ANALYSIS
      # ==================================================

      - name: Select daily Parliament stories
        run: |
          python src/batch_analyze.py \
            data/clean_transcripts \
            data/daily_selection.json

      - name: Show selected stories
        run: |
          python - <<'PY'
          import json

          with open(
              "data/daily_selection.json",
              "r",
              encoding="utf-8"
          ) as file:
              data = json.load(file)

          long_story = data.get(
              "long_video"
          )

          short_story = data.get(
              "short_video"
          )

          print("")
          print("====================================")
          print("DAILY STORY SELECTION")
          print("====================================")

          print("")
          print("LONG VIDEO")
          print("------------------------------------")

          if long_story:
              print(
                  f"Video: "
                  f"{long_story.get('video')}"
              )
              print(
                  f"Start: "
                  f"{long_story.get('start')}"
              )
              print(
                  f"End: "
                  f"{long_story.get('end')}"
              )
              print(
                  f"Score: "
                  f"{long_story.get('score')}"
              )
              print(
                  f"Text: "
                  f"{long_story.get('text')}"
              )
          else:
              print("NOT FOUND")

          print("")
          print("SHORT / REEL")
          print("------------------------------------")

          if short_story:
              print(
                  f"Video: "
                  f"{short_story.get('video')}"
              )
              print(
                  f"Start: "
                  f"{short_story.get('start')}"
              )
              print(
                  f"End: "
                  f"{short_story.get('end')}"
              )
              print(
                  f"Score: "
                  f"{short_story.get('score')}"
              )
              print(
                  f"Text: "
                  f"{short_story.get('text')}"
              )
          else:
              print(
                  "No separate Short story found."
              )

          if not long_story:
              raise RuntimeError(
                  "No Long story selected."
              )
          PY

      # ==================================================
      # 10. DIFFERENT VIDEO CHECK
      # ==================================================

      - name: Verify separate Short video
        run: |
          python - <<'PY'
          import json

          with open(
              "data/daily_selection.json",
              "r",
              encoding="utf-8"
          ) as file:
              data = json.load(file)

          long_story = data.get(
              "long_video"
          )

          short_story = data.get(
              "short_video"
          )

          if not long_story:
              raise RuntimeError(
                  "Long story missing."
              )

          if not short_story:
              print(
                  "No separate Short story."
              )
              print(
                  "Long video will still be generated."
              )
              raise SystemExit(0)

          long_video = long_story.get(
              "video"
          )

          short_video = short_story.get(
              "video"
          )

          print(
              f"Long video:  {long_video}"
          )

          print(
              f"Short video: {short_video}"
          )

          if long_video == short_video:
              raise RuntimeError(
                  "ERROR: Long and Short "
                  "are from the same video."
              )

          print("")
          print(
              "PASSED: Long and Short "
              "are different Parliament videos."
          )
          PY

      # ==================================================
      # 11. ENGLISH SUBTITLES
      # ==================================================

      - name: Translate selected stories
        run: |
          mkdir -p data/subtitles

          python src/batch_translate.py \
            data/daily_selection.json \
            data/clean_transcripts \
            data/subtitles

      - name: Verify English subtitles
        run: |
          echo "Generated subtitles:"
          find data/subtitles \
            -maxdepth 1 \
            -type f \
            -name "*.srt" \
            -print

          test -f \
            data/subtitles/long_subtitles.srt

      # ==================================================
      # 12. CREATE LONG YOUTUBE
      # ==================================================

      - name: Create Long YouTube video
        run: |
          LONG_TRANSCRIPT=$(python - <<'PY'
          import json

          with open(
              "data/daily_selection.json",
              "r",
              encoding="utf-8"
          ) as file:
              data = json.load(file)

          print(
              data["long_video"]["transcript"]
          )
          PY
          )

          python src/clip.py \
            data/videos/video_001.mp4 \
            data/daily_selection.json \
            output/youtube \
            youtube \
            1 \
            "$LONG_TRANSCRIPT"

      # ==================================================
      # 13. CREATE YOUTUBE SHORT
      # ==================================================

      - name: Create Separate YouTube Short
        run: |
          if [ ! -f \
            data/subtitles/short_subtitles.srt
          ]; then
            echo "No separate Short story."
            exit 0
          fi

          SHORT_TRANSCRIPT=$(python - <<'PY'
          import json

          with open(
              "data/daily_selection.json",
              "r",
              encoding="utf-8"
          ) as file:
              data = json.load(file)

          story = data.get("short_video")

          if story:
              print(
                  story.get("transcript", "")
              )
          PY
          )

          if [ -z "$SHORT_TRANSCRIPT" ]; then
            echo "No Short transcript."
            exit 0
          fi

          python src/clip.py \
            data/videos/video_001.mp4 \
            data/daily_selection.json \
            output/youtube_shorts \
            youtube_shorts \
            2 \
            "$SHORT_TRANSCRIPT"

      # ==================================================
      # 14. FACEBOOK LONG
      # ==================================================

      - name: Create Long Facebook video
        run: |
          LONG_TRANSCRIPT=$(python - <<'PY'
          import json

          with open(
              "data/daily_selection.json",
              "r",
              encoding="utf-8"
          ) as file:
              data = json.load(file)

          print(
              data["long_video"]["transcript"]
          )
          PY
          )

          python src/clip.py \
            data/videos/video_001.mp4 \
            data/daily_selection.json \
            output/facebook \
            facebook \
            1 \
            "$LONG_TRANSCRIPT"

      # ==================================================
      # 15. FACEBOOK REEL
      # ==================================================

      - name: Create Separate Facebook Reel
        run: |
          if [ ! -f \
            data/subtitles/short_subtitles.srt
          ]; then
            echo "No separate Reel story."
            exit 0
          fi

          SHORT_TRANSCRIPT=$(python - <<'PY'
          import json

          with open(
              "data/daily_selection.json",
              "r",
              encoding="utf-8"
          ) as file:
              data = json.load(file)

          story = data.get("short_video")

          if story:
              print(
                  story.get("transcript", "")
              )
          PY
          )

          if [ -z "$SHORT_TRANSCRIPT" ]; then
            exit 0
          fi

          python src/clip.py \
            data/videos/video_001.mp4 \
            data/daily_selection.json \
            output/facebook_reels \
            facebook_reels \
            2 \
            "$SHORT_TRANSCRIPT"

      # ==================================================
      # 16. INSTAGRAM LONG
      # ==================================================

      - name: Create Long Instagram video
        run: |
          LONG_TRANSCRIPT=$(python - <<'PY'
          import json

          with open(
              "data/daily_selection.json",
              "r",
              encoding="utf-8"
          ) as file:
              data = json.load(file)

          print(
              data["long_video"]["transcript"]
          )
          PY
          )

          python src/clip.py \
            data/videos/video_001.mp4 \
            data/daily_selection.json \
            output/instagram \
            instagram \
            1 \
            "$LONG_TRANSCRIPT"

      # ==================================================
      # 17. INSTAGRAM REEL
      # ==================================================

      - name: Create Separate Instagram Reel
        run: |
          if [ ! -f \
            data/subtitles/short_subtitles.srt
          ]; then
            echo "No separate Reel story."
            exit 0
          fi

          SHORT_TRANSCRIPT=$(python - <<'PY'
          import json

          with open(
              "data/daily_selection.json",
              "r",
              encoding="utf-8"
          ) as file:
              data = json.load(file)

          story = data.get("short_video")

          if story:
              print(
                  story.get("transcript", "")
              )
          PY
          )

          if [ -z "$SHORT_TRANSCRIPT" ]; then
            exit 0
          fi

          python src/clip.py \
            data/videos/video_001.mp4 \
            data/daily_selection.json \
            output/instagram_reels \
            instagram_reels \
            2 \
            "$SHORT_TRANSCRIPT"

      # ==================================================
      # 18. TIKTOK
      # ==================================================

      - name: Create TikTok video
        run: |
          LONG_TRANSCRIPT=$(python - <<'PY'
          import json

          with open(
              "data/daily_selection.json",
              "r",
              encoding="utf-8"
          ) as file:
              data = json.load(file)

          print(
              data["long_video"]["transcript"]
          )
          PY
          )

          python src/clip.py \
            data/videos/video_001.mp4 \
            data/daily_selection.json \
            output/tiktok \
            tiktok \
            1 \
            "$LONG_TRANSCRIPT"

      # ==================================================
      # 19. UPLOAD ARTIFACTS
      # ==================================================

      - name: Upload daily selection
        uses: actions/upload-artifact@v4
        with:
          name: parliament-daily-selection
          path: data/daily_selection.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload English subtitles
        uses: actions/upload-artifact@v4
        with:
          name: parliament-english-subtitles
          path: data/subtitles/
          if-no-files-found: error
          retention-days: 7

      - name: Upload generated clips
        uses: actions/upload-artifact@v4
        with:
          name: parliament-daily-platform-clips
          path: output/
          if-no-files-found: warn
          retention-days: 7
