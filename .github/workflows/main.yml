name: Parliament Pulse Nepal Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"
      timezone: "Asia/Kathmandu"

jobs:
  daily-parliament-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Discover Parliament collections
        run: |
          mkdir -p data
          python src/discover.py data/videos.json

      - name: Verify discovery
        run: |
          python - <<'PY'
          import json
          with open("data/videos.json", "r", encoding="utf-8") as file:
              collections = json.load(file)
          print("Parliament collections found:", len(collections))
          if not collections:
              raise RuntimeError("No Parliament collections found.")
          for index, item in enumerate(collections[:10], start=1):
              print(f"{index}. {item.get('title', '')}")
              print(item.get('url', ''))
          PY

      - name: Download Parliament videos
        run: |
          python - <<'PY'
          import json
          import subprocess
          with open("data/videos.json", "r", encoding="utf-8") as file:
              collections = json.load(file)
          if not collections:
              raise RuntimeError("No Parliament collection available.")
          collection_url = collections[0]["url"]
          print("Selected Parliament collection:", collection_url)
          result = subprocess.run(
              ["python", "src/download.py", collection_url, "data/videos", "5"],
              text=True,
          )
          if result.returncode != 0:
              raise RuntimeError("Parliament video download failed.")
          PY

      - name: Verify downloaded videos
        run: |
          python - <<'PY'
          from pathlib import Path
          videos = sorted(Path("data/videos").glob("video_*.mp4"))
          print("Downloaded Parliament videos:", len(videos))
          if len(videos) < 2:
              raise RuntimeError("At least 2 Parliament videos are required for separate Long and Short stories.")
          for video in videos:
              size = video.stat().st_size
              print(f"{video} - {size / (1024 * 1024):.2f} MB")
              if size < 10000:
                  raise RuntimeError(f"Video is unexpectedly small: {video}")
          PY

      - name: Transcribe Parliament videos
        run: |
          mkdir -p data/transcripts
          python src/batch_transcribe.py data/videos data/transcripts

      - name: Verify transcripts
        run: |
          python - <<'PY'
          from pathlib import Path
          transcripts = sorted(Path("data/transcripts").glob("video_*.json"))
          print(f"Transcript files: {len(transcripts)}")
          if not transcripts:
              raise RuntimeError("No transcripts were created.")
          PY

      - name: Clean transcripts
        run: |
          mkdir -p data/transcripts_clean
          python src/batch_clean.py data/transcripts data/transcripts_clean

      - name: Verify cleaned transcripts
        run: |
          python - <<'PY'
          from pathlib import Path
          transcripts = sorted(Path("data/transcripts_clean").glob("video_*.json"))
          print(f"Cleaned transcript files: {len(transcripts)}")
          if not transcripts:
              raise RuntimeError("No cleaned transcripts found.")
          PY

      - name: Select daily Parliament stories
        run: |
          python src/batch_analyze.py data/transcripts_clean data/daily_selection.json

      - name: Verify separate Short video
        run: |
          python - <<'PY'
          import json
          with open("data/daily_selection.json", "r", encoding="utf-8") as file:
              data = json.load(file)
          long_story = data.get("long_video")
          short_story = data.get("short_video")
          if not long_story:
              raise RuntimeError("Long Parliament story was not selected.")
          if not short_story:
              raise RuntimeError("No separate Short/Reel story found. Workflow will not duplicate the Long video.")
          if long_story.get("video") == short_story.get("video"):
              raise RuntimeError("Long and Short videos are the same. Separate video requirement failed.")
          print("Long video:", long_story.get("video"))
          print("Short video:", short_story.get("video"))
          print("SEPARATE SHORT VIDEO CHECK PASSED")
          PY

      - name: Prepare selected story files
        run: |
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path
          with open("data/daily_selection.json", "r", encoding="utf-8") as file:
              data = json.load(file)
          long_story = data["long_video"]
          short_story = data["short_video"]
          long_video = Path(long_story["video"])
          short_video = Path(short_story["video"])
          long_transcript = Path(long_story["transcript"])
          short_transcript = Path(short_story["transcript"])
          for path, label in [
              (long_video, "Long video"),
              (short_video, "Short video"),
              (long_transcript, "Long transcript"),
              (short_transcript, "Short transcript"),
          ]:
              if not path.exists():
                  raise RuntimeError(f"{label} missing: {path}")
          shutil.copy2(long_video, "data/selected_long.mp4")
          shutil.copy2(short_video, "data/selected_short.mp4")
          shutil.copy2(long_transcript, "data/long_transcript.json")
          shutil.copy2(short_transcript, "data/short_transcript.json")
          PY

      - name: Translate Long story
        run: |
          python - <<'PY'
          import json
          import subprocess
          with open("data/daily_selection.json", "r", encoding="utf-8") as file:
              data = json.load(file)
          result = subprocess.run(
              ["python", "src/translate.py", data["long_video"]["transcript"], "data/long_subtitles.srt"],
              text=True,
          )
          if result.returncode != 0:
              raise RuntimeError("Long story translation failed.")
          PY

      - name: Translate Short story
        run: |
          python - <<'PY'
          import json
          import subprocess
          with open("data/daily_selection.json", "r", encoding="utf-8") as file:
              data = json.load(file)
          result = subprocess.run(
              ["python", "src/translate.py", data["short_video"]["transcript"], "data/short_subtitles.srt"],
              text=True,
          )
          if result.returncode != 0:
              raise RuntimeError("Short story translation failed.")
          PY

      - name: Generate titles descriptions and keywords
        run: |
          mkdir -p data/metadata
          python src/generate_metadata.py data/daily_selection.json data/metadata
          test -s data/metadata/long_metadata.json
          test -s data/metadata/short_metadata.json

      - name: Generate thumbnails
        run: |
          mkdir -p data/thumbnails
          python - <<'PY'
          import json
          import subprocess
          with open("data/metadata/long_metadata.json", "r", encoding="utf-8") as file:
              long_meta = json.load(file)
          with open("data/metadata/short_metadata.json", "r", encoding="utf-8") as file:
              short_meta = json.load(file)
          commands = [
              [
                  "python", "src/thumbnail.py",
                  "data/selected_long.mp4",
                  long_meta["title"],
                  str(long_meta["start"]),
                  "data/thumbnails/long_thumbnail.jpg",
                  "false",
              ],
              [
                  "python", "src/thumbnail.py",
                  "data/selected_short.mp4",
                  short_meta["title"],
                  str(short_meta["start"]),
                  "data/thumbnails/short_thumbnail.jpg",
                  "true",
              ],
          ]
          for command in commands:
              result = subprocess.run(command, text=True)
              if result.returncode != 0:
                  raise RuntimeError("Thumbnail generation failed.")
          PY
          test -s data/thumbnails/long_thumbnail.jpg
          test -s data/thumbnails/short_thumbnail.jpg

      - name: Prepare Long analysis
        run: |
          python - <<'PY'
          import json
          with open("data/daily_selection.json", "r", encoding="utf-8") as file:
              data = json.load(file)
          with open("data/long_analysis.json", "w", encoding="utf-8") as file:
              json.dump({"long_video": data["long_video"]}, file, ensure_ascii=False, indent=2)
          PY

      - name: Prepare Short analysis
        run: |
          python - <<'PY'
          import json
          with open("data/daily_selection.json", "r", encoding="utf-8") as file:
              data = json.load(file)
          with open("data/short_analysis.json", "w", encoding="utf-8") as file:
              json.dump({"short_video": data["short_video"]}, file, ensure_ascii=False, indent=2)
          PY

      - name: Create Long YouTube video
        run: |
          python src/clip.py data/selected_long.mp4 data/long_analysis.json output/youtube youtube 1 data/long_subtitles.srt

      - name: Create Separate YouTube Short
        run: |
          python src/clip.py data/selected_short.mp4 data/short_analysis.json output/youtube_shorts youtube_shorts 2 data/short_subtitles.srt

      - name: Create Long Facebook video
        run: |
          python src/clip.py data/selected_long.mp4 data/long_analysis.json output/facebook facebook 1 data/long_subtitles.srt

      - name: Create Separate Facebook Reel
        run: |
          python src/clip.py data/selected_short.mp4 data/short_analysis.json output/facebook_reels facebook 2 data/short_subtitles.srt

      - name: Create Long Instagram video
        run: |
          python src/clip.py data/selected_long.mp4 data/long_analysis.json output/instagram instagram 1 data/long_subtitles.srt

      - name: Create Separate Instagram Reel
        run: |
          python src/clip.py data/selected_short.mp4 data/short_analysis.json output/instagram_reels instagram_reels 2 data/short_subtitles.srt

      - name: Create Long TikTok video
        run: |
          python src/clip.py data/selected_long.mp4 data/long_analysis.json output/tiktok tiktok 1 data/long_subtitles.srt

      - name: Create Separate TikTok video
        run: |
          python src/clip.py data/selected_short.mp4 data/short_analysis.json output/tiktok_shorts tiktok_shorts 2 data/short_subtitles.srt

      - name: Verify video duration rules
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          def duration(path):
              result = subprocess.run(
                  [
                      "ffprobe", "-v", "error",
                      "-show_entries", "format=duration",
                      "-of", "default=noprint_wrappers=1:nokey=1",
                      str(path),
                  ],
                  capture_output=True,
                  text=True,
                  check=True,
              )
              return float(result.stdout.strip())

          long_files = [
              Path("output/youtube/youtube_long.mp4"),
              Path("output/facebook/facebook_long.mp4"),
              Path("output/instagram/instagram_long.mp4"),
              Path("output/tiktok/tiktok_long.mp4"),
          ]
          short_files = [
              Path("output/youtube_shorts/youtube_short.mp4"),
              Path("output/facebook_reels/facebook_reel.mp4"),
              Path("output/instagram_reels/instagram_reel.mp4"),
              Path("output/tiktok_shorts/tiktok_short.mp4"),
          ]

          for path in long_files:
              seconds = duration(path)
              print(f"{path}: {seconds:.2f}s")
              if seconds <= 180:
                  raise RuntimeError(f"Long video must be longer than 3 minutes: {path} ({seconds:.2f}s)")

          for path in short_files:
              seconds = duration(path)
              print(f"{path}: {seconds:.2f}s")
              if seconds >= 90:
                  raise RuntimeError(f"Reel/Short must be under 90 seconds: {path} ({seconds:.2f}s)")

          print("DURATION RULES PASSED: long > 180s, short/reel < 90s")
          PY

      - name: Verify generated clips
        run: |
          count=$(find output -type f -name "*.mp4" | wc -l)
          echo "Generated MP4 count: $count"
          if [ "$count" -lt 8 ]; then
            echo "Expected at least 8 platform MP4 files."
            exit 1
          fi

      - name: Upload daily selection
        uses: actions/upload-artifact@v4
        with:
          name: parliament-daily-selection
          path: |
            data/daily_selection.json
            data/long_analysis.json
            data/short_analysis.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload English subtitles
        uses: actions/upload-artifact@v4
        with:
          name: parliament-english-subtitles
          path: |
            data/long_subtitles.srt
            data/short_subtitles.srt
          if-no-files-found: error
          retention-days: 7

      - name: Upload clean transcripts
        uses: actions/upload-artifact@v4
        with:
          name: parliament-clean-transcripts
          path: data/transcripts_clean/
          if-no-files-found: error
          retention-days: 7

      - name: Upload metadata and thumbnails
        uses: actions/upload-artifact@v4
        with:
          name: parliament-metadata-thumbnails
          path: |
            data/metadata/
            data/thumbnails/
          if-no-files-found: error
          retention-days: 7

      - name: Upload generated clips
        uses: actions/upload-artifact@v4
        with:
          name: parliament-platform-clips
          path: output/
          if-no-files-found: error
          retention-days: 7

      - name: Upload downloaded Parliament videos
        uses: actions/upload-artifact@v4
        with:
          name: parliament-selected-source-videos
          path: |
            data/selected_long.mp4
            data/selected_short.mp4
          if-no-files-found: error
          retention-days: 3
