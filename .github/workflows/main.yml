name: Parliament Pulse Nepal Automation

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Test discovery
        run: |
          python src/discover.py data/videos.json

      - name: Test individual Parliament video detection
        run: |      - name: Test actual video download
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from src.download import (
              get_session,
              get_video_pages,
              get_video_source,
              download_file
          )

          with open(
              "data/videos.json",
              "r",
              encoding="utf-8"
          ) as file:
              collections = json.load(file)

          if not collections:
              raise RuntimeError(
                  "No Parliament collections found."
              )

          session = get_session()

          videos = get_video_pages(
              collections[0]["url"],
              session
          )

          if not videos:
              raise RuntimeError(
                  "No individual videos found."
              )

          video = videos[0]

          source = get_video_source(
              video["url"],
              session
          )

          if not source:
              raise RuntimeError(
                  "Video source not found."
              )

          output = Path(
              "data/test_video.mp4"
          )

          download_file(
              source,
              output,
              session
          )

          size = output.stat().st_size

          print(
              f"Downloaded: {output}"
          )

          print(
              f"File size: {size / (1024 * 1024):.2f} MB"
          )

          if size < 10000:
              raise RuntimeError(
                  "Downloaded file is unexpectedly small."
              )
          PY
