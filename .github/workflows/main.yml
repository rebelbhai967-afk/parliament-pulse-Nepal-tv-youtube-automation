name: Parliament Pulse Nepal Automation

on:
  workflow_dispatch:

jobs:
  daily-parliament-automation:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Discover Parliament collections
        run: |
          mkdir -p data
          python src/discover.py data/videos.json

      - name: Verify discovery
        run: |
          python - <<'PY'
          import json

          with open(
              "data/videos.json",
              "r",
              encoding="utf-8"
          ) as file:
              collections = json.load(file)

          print("Parliament collections found:")
          print(len(collections))

          if not collections:
              raise RuntimeError(
                  "No Parliament collections found."
              )

          for index, item in enumerate(
              collections[:10],
              start=1
          ):
              print("")
              print(f"{index}. {item.get('title', '')}")
              print(item.get('url', ''))
          PY

      - name: Download Parliament videos
        run: |
          python - <<'PY'
          import json
          import subprocess

          with open(
              "data/videos.json",
              "r",
              encoding="utf-8"
          ) as file:
              collections = json.load(file)

          if not collections:
              raise RuntimeError(
                  "No Parliament collection available."
              )

          collection_url = collections[0]["url"]

          print("Selected Parliament collection:")
          print(collection_url)

          command = [
              "python",
              "src/download.py",
              collection_url,
              "data/videos",
              "5",
          ]

          result = subprocess.run(
              command,
              text=True
          )

          if result.returncode != 0:
              raise RuntimeError(
                  "Parliament video download failed."
              )
          PY

      - name: Verify downloaded videos
        run: |
          python - <<'PY'
          from pathlib import Path

          videos = sorted(
              Path("data/videos").glob(
                  "video_*.mp4"
              )
          )

          print("")
          print("Downloaded Parliament videos:")
          print(len(videos))

          if len(videos) < 2:
              raise RuntimeError(
                  "At least 2 Parliament videos are required "
                  "for separate Long and Short stories."
              )

          for video in videos:
              size = video.stat().st_size

              print(
                  f"{video} - "
                  f"{size / (1024 * 1024):.2f} MB"
              )

              if size < 10000:
                  raise RuntimeError(
                      f"Video is unexpectedly small: {video}"
                  )
          PY

      - name: Transcribe Parliament videos
        run: |
          mkdir -p data/transcripts

          python src/batch_transcribe.py \
            data/videos \
            data/transcripts

      - name: Verify transcripts
        run: |
          python - <<'PY'
          from pathlib import Path

          transcripts = sorted(
              Path("data/transcripts").glob(
                  "video_*.json"
              )
          )

          print(
              f"Transcript files: {len(transcripts)}"
          )

          if not transcripts:
              raise RuntimeError(
                  "No transcripts were created."
              )

          for transcript in transcripts:
              print(transcript)
          PY

      - name: Clean transcripts
        run: |
          mkdir -p data/transcripts_clean

          python src/batch_clean.py \
            data/transcripts \
            data/transcripts_clean

      - name: Verify cleaned transcripts
        run: |
          python - <<'PY'
          from pathlib import Path

          transcripts = sorted(
              Path("data/transcripts_clean").glob(
                  "video_*.json"
              )
          )

          print(
              f"Cleaned transcript files: "
              f"{len(transcripts)}"
          )

          if not transcripts:
              raise RuntimeError(
                  "No cleaned transcripts found."
              )

          for transcript in transcripts:
              print(transcript)
          PY

      - name: Select daily Parliament stories
        run: |
          python src/batch_analyze.py \
            data/transcripts_clean \
            data/daily_selection.json

      - name: Show selected stories
        run: |
          python - <<'PY'
          import json

          with open(
              "data/daily_selection.json",
              "r",
              encoding="utf-8"
          ) as file:
              data = json.load(file)

          long_story = data.get(
              "long_video"
          )

          short_story = data.get(
              "short_video"
          )

          print("")
          print("====================================")
          print("DAILY PARLIAMENT STORIES")
          print("====================================")

          print("")
          print("LONG VIDEO")
          print(
              "Video:",
              long_story.get("video")
          )
          print(
              "Start:",
              long_story.get("start")
          )
          print(
              "End:",
              long_story.get("end")
          )
          print(
              "Score:",
              long_story.get("score")
          )
          print(
              "Text:",
              long_story.get("text")
          )

          print("")
          print("SHORT / REEL")

          if short_story:
              print(
                  "Video:",
                  short_story.get("video")
              )
              print(
                  "Start:",
                  short_story.get("start")
              )
              print(
                  "End:",
                  short_story.get("end")
              )
              print(
                  "Score:",
                  short_story.get("score")
              )
              print(
                  "Text:",
                  short_story.get("text")
              )
          else:
              print(
                  "NO SEPARATE SHORT STORY FOUND"
              )
          PY

      - name: Verify separate Short video
        run: |
          python - <<'PY'
          import json

          with open(
              "data/daily_selection.json",
              "r",
              encoding="utf-8"
          ) as file:
              data = json.load(file)

          long_story = data.get(
              "long_video"
          )

          short_story = data.get(
              "short_video"
          )

          if not long_story:
              raise RuntimeError(
                  "Long Parliament story was not selected."
              )

          if not short_story:
              raise RuntimeError(
                  "No separate Short/Reel story found. "
                  "Workflow will not duplicate the Long video."
              )

          long_video = long_story.get(
              "video"
          )

          short_video = short_story.get(
              "video"
          )

          print(
              "Long video:",
              long_video
          )

          print(
              "Short video:",
              short_video
          )

          if long_video == short_video:
              raise RuntimeError(
                  "Long and Short videos are the same. "
                  "Separate video requirement failed."
              )

          print("")
          print(
              "SEPARATE SHORT VIDEO CHECK PASSED"
          )
          PY

      - name: Prepare selected story files
        run: |
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          with open(
              "data/daily_selection.json",
              "r",
              encoding="utf-8"
          ) as file:
              data = json.load(file)

          long_story = data["long_video"]
          short_story = data["short_video"]

          long_video = Path(
              long_story["video"]
          )

          short_video = Path(
              short_story["video"]
          )

          long_transcript = Path(
              long_story["transcript"]
          )

          short_transcript = Path(
              short_story["transcript"]
          )

          if not long_video.exists():
              raise RuntimeError(
                  f"Long video missing: {long_video}"
              )

          if not short_video.exists():
              raise RuntimeError(
                  f"Short video missing: {short_video}"
              )

          if not long_transcript.exists():
              raise RuntimeError(
                  f"Long transcript missing: {long_transcript}"
              )

          if not short_transcript.exists():
              raise RuntimeError(
                  f"Short transcript missing: {short_transcript}"
              )

          Path("data").mkdir(
              parents=True,
              exist_ok=True
          )

          shutil.copy2(
              long_video,
              "data/selected_long.mp4"
          )

          shutil.copy2(
              short_video,
              "data/selected_short.mp4"
          )

          shutil.copy2(
              long_transcript,
              "data/selected_long_transcript.json"
          )

          shutil.copy2(
              short_transcript,
              "data/selected_short_transcript.json"
          )

          print(
              "Selected Long:",
              long_video
          )

          print(
              "Selected Short:",
              short_video
          )

          print(
              "Long transcript:",
              long_transcript
          )

          print(
              "Short transcript:",
              short_transcript
          )
          PY

      - name: Translate Long story
        run: |
          python - <<'PY'
          import json
          import subprocess

          with open(
              "data/daily_selection.json",
              "r",
              encoding="utf-8"
          ) as file:
              data = json.load(file)

          transcript = data["long_video"][
              "transcript"
          ]

          result = subprocess.run(
              [
                  "python",
                  "src/translate.py",
                  transcript,
                  "data/long_subtitles.srt",
              ],
              text=True
          )

          if result.returncode != 0:
              raise RuntimeError(
                  "Long story translation failed."
              )
          PY

      - name: Translate Short story
        run: |
          python - <<'PY'
          import json
          import subprocess

          with open(
              "data/daily_selection.json",
              "r",
              encoding="utf-8"
          ) as file:
              data = json.load(file)

          transcript = data["short_video"][
              "transcript"
          ]

          result = subprocess.run(
              [
                  "python",
                  "src/translate.py",
                  transcript,
                  "data/short_subtitles.srt",
              ],
              text=True
          )

          if result.returncode != 0:
              raise RuntimeError(
                  "Short story translation failed."
              )
          PY

      - name: Verify English subtitles
        run: |
          test -s data/long_subtitles.srt
          test -s data/short_subtitles.srt

          echo "Long subtitles:"
          wc -l data/long_subtitles.srt

          echo "Short subtitles:"
          wc -l data/short_subtitles.srt

      - name: Prepare Long analysis
        run: |
          python - <<'PY'
          import json

          with open(
              "data/daily_selection.json",
              "r",
              encoding="utf-8"
          ) as file:
              data = json.load(file)

          result = {
              "long_video": data["long_video"]
          }

          with open(
              "data/long_analysis.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  result,
                  file,
                  ensure_ascii=False,
                  indent=2
              )
          PY

      - name: Prepare Short analysis
        run: |
          python - <<'PY'
          import json

          with open(
              "data/daily_selection.json",
              "r",
              encoding="utf-8"
          ) as file:
              data = json.load(file)

          result = {
              "short_video": data["short_video"]
          }

          with open(
              "data/short_analysis.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  result,
                  file,
                  ensure_ascii=False,
                  indent=2
              )
          PY

      - name: Create Long YouTube video
        run: |
          python src/clip.py \
            data/selected_long.mp4 \
            data/long_analysis.json \
            output/youtube \
            youtube \
            1 \
            data/selected_long_transcript.json

      - name: Create Separate YouTube Short
        run: |
          python src/clip.py \
            data/selected_short.mp4 \
            data/short_analysis.json \
            output/youtube_shorts \
            youtube_shorts \
            2 \
            data/selected_short_transcript.json

      - name: Create Long Facebook video
        run: |
          python src/clip.py \
            data/selected_long.mp4 \
            data/long_analysis.json \
            output/facebook \
            facebook \
            1 \
            data/selected_long_transcript.json

      - name: Create Separate Facebook Reel
        run: |
          python src/clip.py \
            data/selected_short.mp4 \
            data/short_analysis.json \
            output/facebook_reels \
            facebook \
            2 \
            data/selected_short_transcript.json

      - name: Create Long Instagram video
        run: |
          python src/clip.py \
            data/selected_long.mp4 \
            data/long_analysis.json \
            output/instagram \
            instagram \
            1 \
            data/selected_long_transcript.json

      - name: Create Separate Instagram Reel
        run: |
          python src/clip.py \
            data/selected_short.mp4 \
            data/short_analysis.json \
            output/instagram_reels \
            instagram \
            2 \
            data/selected_short_transcript.json

      - name: Create Long TikTok video
        run: |
          python src/clip.py \
            data/selected_long.mp4 \
            data/long_analysis.json \
            output/tiktok \
            tiktok \
            1 \
            data/selected_long_transcript.json

      - name: Create Separate TikTok video
        run: |
          python src/clip.py \
            data/selected_short.mp4 \
            data/short_analysis.json \
            output/tiktok_shorts \
            tiktok \
            2 \
            data/selected_short_transcript.json

      - name: Verify generated clips
        run: |
          echo "Generated files:"
          find output -type f -print

          count=$(find output -type f | wc -l)

          echo ""
          echo "Generated file count: $count"

          if [ "$count" -lt 2 ]; then
            echo "Not enough clips generated."
            exit 1
          fi

      - name: Upload daily selection
        uses: actions/upload-artifact@v4
        with:
          name: parliament-daily-selection
          path: |
            data/daily_selection.json
            data/long_analysis.json
            data/short_analysis.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload English subtitles
        uses: actions/upload-artifact@v4
        with:
          name: parliament-english-subtitles
          path: |
            data/long_subtitles.srt
            data/short_subtitles.srt
          if-no-files-found: error
          retention-days: 7

      - name: Upload clean transcripts
        uses: actions/upload-artifact@v4
        with:
          name: parliament-clean-transcripts
          path: data/transcripts_clean/
          if-no-files-found: error
          retention-days: 7

      - name: Upload generated clips
        uses: actions/upload-artifact@v4
        with:
          name: parliament-platform-clips
          path: output/
          if-no-files-found: error
          retention-days: 7

      - name: Upload downloaded Parliament videos
        uses: actions/upload-artifact@v4
        with:
          name: parliament-selected-source-videos
          path: |
            data/selected_long.mp4
            data/selected_short.mp4
          if-no-files-found: error
          retention-days: 3
